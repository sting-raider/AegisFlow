name: capacity-acceptance

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sustained-30fps-30m:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.8.3"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: uv sync --locked --extra dev
      - name: Run predeclared 30-minute 30 flows/s point
        run: >-
          make benchmark-sustained
          SUSTAINED_DURATION=1800
          SUSTAINED_RATE=30
          SUSTAINED_OUTPUT=sustained-compose-linux-ci-30fps-30m.json
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sustained-compose-linux-ci-30fps-30m
          path: docs/benchmarks/sustained-compose-linux-ci-30fps-30m.json
          if-no-files-found: warn
      - if: always()
        run: docker compose -f compose.yml -f compose.demo.yml down -v --remove-orphans
