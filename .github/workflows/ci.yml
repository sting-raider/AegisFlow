name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.8.3"
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: uv sync --locked --extra dev
      - run: uv run ruff check .
      - run: uv run mypy packages services apps/api training scripts migrations
      - run: uv run python -m scripts.verify_frozen_evidence
      - run: uv run python -m scripts.verify_research_experiments
      - run: uv run pytest --cov=packages --cov=services --cov=apps.api
      - name: Production preflight rejects checked-in defaults
        run: |
          set +e
          uv run python -m scripts.production_check --output production-check.json
          status=$?
          set -e
          test "$status" -ne 0
          uv run python -c "import json; report=json.load(open('production-check.json')); codes={item['code'] for item in report['errors']}; assert report['passed'] is False and {'demo_enabled','missing_readiness_report'} <= codes"
      - run: uv run python scripts/evaluate_nfstream.py --pcap tests/fixtures/demo.pcap
      - run: uv run python -m training.cli.train_smoke
      - run: AEGISFLOW_DATABASE_URL=sqlite:///ci-migration.db uv run python -m scripts.migrate

  dashboard:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/dashboard/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run lint
      - run: npm run build
      - run: npm test

  compose:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: docker compose -f compose.yml -f compose.demo.yml config --quiet
      - run: docker compose -f compose.yml -f compose.oidc.yml config --quiet
      - run: INTERFACE=eth0 docker compose -f compose.yml -f compose.live.yml --profile live config --quiet
      - run: SURICATA_PCAP="$PWD/tests/fixtures/demo.pcap" docker compose -f compose.suricata.yml --profile suricata config --quiet
      - run: >-
          AEGISFLOW_OIDC_ISSUER=https://identity.example.invalid/
          AEGISFLOW_OIDC_AUDIENCE=aegisflow-api
          AEGISFLOW_OIDC_JWKS_URL=https://identity.example.invalid/.well-known/jwks.json
          AEGISFLOW_CORS_ORIGINS=https://aegisflow.example.invalid
          AEGISFLOW_DB_PASSWORD_SECRET_FILE=/tmp/aegisflow-db-password
          AEGISFLOW_DATABASE_URL_SECRET_FILE=/tmp/aegisflow-database-url
          docker compose -f compose.yml -f compose.production.yml config --quiet
      - run: kubectl kustomize infra/kubernetes >/dev/null
      - run: docker compose -f compose.yml -f compose.demo.yml build
      - run: docker build -f infra/docker/backend.Dockerfile --target sensor-live -t aegisflow-sensor-live:ci .
      - run: >-
          docker run --rm --network none --read-only
          --security-opt no-new-privileges --cap-drop ALL --cap-add NET_RAW
          --entrypoint python aegisflow-sensor-live:ci
          scripts/evaluate_nfstream.py --interface lo --loopback-probe

  integration:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.8.3"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/dashboard/package-lock.json
      - run: uv sync --locked --extra dev
      - run: uv run python -m training.cli.train_smoke
      - run: docker compose -f compose.yml -f compose.demo.yml up --build -d
      - run: docker compose -f compose.yml -f compose.demo.yml run --rm sensor
      - run: |
          ready=0
          for attempt in {1..30}; do
            if curl --fail http://127.0.0.1:8000/health/ready; then ready=1; break; fi
            sleep 2
          done
          test "$ready" -eq 1
          curl --fail http://127.0.0.1:8000/api/v1/alerts
      - run: |
          docker compose -f compose.yml -f compose.demo.yml up -d --force-recreate api
          ready=0
          for attempt in {1..30}; do
            if curl --fail http://127.0.0.1:5173/health/ready; then ready=1; break; fi
            sleep 2
          done
          test "$ready" -eq 1
      - run: npm ci
        working-directory: apps/dashboard
      - run: npx playwright install --with-deps chromium
        working-directory: apps/dashboard
      - run: npm run test:e2e
        working-directory: apps/dashboard
      - if: always()
        run: docker compose -f compose.yml -f compose.demo.yml logs
      - if: always()
        run: docker compose -f compose.yml -f compose.demo.yml down -v

  oidc-integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.8.3"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: uv sync --locked --extra dev
      - run: make oidc-acceptance OIDC_OUTPUT=docs/acceptance/oidc-ci.json
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oidc-acceptance-report
          path: docs/acceptance/oidc-ci.json
          if-no-files-found: warn
      - if: always()
        run: docker compose -f compose.yml -f compose.oidc.yml logs
      - if: always()
        run: docker compose -f compose.yml -f compose.oidc.yml down -v

  restore-integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.8.3"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: uv sync --locked --extra dev
      - run: make restore-acceptance RESTORE_OUTPUT=docs/acceptance/restore-ci.json
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: restore-acceptance-report
          path: docs/acceptance/restore-ci.json
          if-no-files-found: warn
      - if: always()
        run: >-
          docker compose --project-name aegisflow-restore-acceptance
          -f compose.yml -f compose.demo.yml down -v --remove-orphans

  kubernetes-integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.8.3"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: uv sync --locked --extra dev
      - name: Install pinned kind
        run: |
          curl --fail --location --output /tmp/kind \
            https://github.com/kubernetes-sigs/kind/releases/download/v0.32.0/kind-linux-amd64
          echo "50030de23cf40a18505f20426f6a8506bedf13c6e509244bd1fa9463721b0f54  /tmp/kind" \
            | sha256sum --check
          sudo install -m 0755 /tmp/kind /usr/local/bin/kind
      - run: make kubernetes-acceptance KUBERNETES_OUTPUT=docs/acceptance/kubernetes-ci.json
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kubernetes-acceptance-report
          path: docs/acceptance/kubernetes-ci.json
          if-no-files-found: warn
      - if: failure()
        run: |
          kubectl get pods -A -o wide || true
          kubectl -n aegisflow describe pods || true
          kubectl -n aegisflow logs -l app.kubernetes.io/name=aegisflow-api --all-containers || true
          kubectl -n aegisflow logs -l app.kubernetes.io/name=aegisflow-detector --all-containers || true
      - if: always()
        run: kind delete cluster --name aegisflow-acceptance || true

  security:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          ignore-unfixed: true
