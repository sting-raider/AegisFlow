name: aegisflow

services:
  postgres:
    image: postgres:16.4-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: aegisflow
      POSTGRES_USER: aegisflow
      POSTGRES_PASSWORD: ${AEGISFLOW_DB_PASSWORD:-aegisflow-demo-only}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aegisflow -d aegisflow"]
      interval: 3s
      timeout: 3s
      retries: 20
    security_opt: ["no-new-privileges:true"]

  redis:
    image: redis:7.2.5-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20
    security_opt: ["no-new-privileges:true"]

  api:
    build:
      context: .
      dockerfile: infra/docker/backend.Dockerfile
    command: ["sh", "-c", "alembic upgrade head && uvicorn apps.api.main:app --host 0.0.0.0 --port 8000"]
    restart: unless-stopped
    environment:
      AEGISFLOW_DATABASE_URL: postgresql+psycopg://aegisflow:${AEGISFLOW_DB_PASSWORD:-aegisflow-demo-only}@postgres:5432/aegisflow
      AEGISFLOW_REDIS_URL: redis://redis:6379/0
      AEGISFLOW_CONSUME_REDIS: "1"
      AEGISFLOW_DEMO: ${AEGISFLOW_DEMO:-1}
      AEGISFLOW_DEMO_SEED: "0"
      AEGISFLOW_MODEL_REGISTRY: /app/models/registry
      AEGISFLOW_API_KEY: ${AEGISFLOW_API_KEY:-}
      AEGISFLOW_PENDING_IDLE_MS: ${AEGISFLOW_PENDING_IDLE_MS:-30000}
      AEGISFLOW_HTTP_MAX_BODY_BYTES: ${AEGISFLOW_HTTP_MAX_BODY_BYTES:-65536}
      AEGISFLOW_WEBSOCKET_MAX_CONNECTIONS: ${AEGISFLOW_WEBSOCKET_MAX_CONNECTIONS:-32}
      AEGISFLOW_WEBSOCKET_MAX_PAYLOAD_BYTES: ${AEGISFLOW_WEBSOCKET_MAX_PAYLOAD_BYTES:-262144}
      AEGISFLOW_STREAM_MAXLEN: ${AEGISFLOW_STREAM_MAXLEN:-100000}
      AEGISFLOW_STREAM_MAX_PAYLOAD_BYTES: ${AEGISFLOW_STREAM_MAX_PAYLOAD_BYTES:-1048576}
      AEGISFLOW_BACKPRESSURE_THRESHOLD: ${AEGISFLOW_BACKPRESSURE_THRESHOLD:-0.8}
      AEGISFLOW_PERSISTENCE_BATCH_SIZE: ${AEGISFLOW_PERSISTENCE_BATCH_SIZE:-64}
      AEGISFLOW_RETENTION_ENABLED: ${AEGISFLOW_RETENTION_ENABLED:-1}
      AEGISFLOW_RETENTION_DAYS: ${AEGISFLOW_RETENTION_DAYS:-30}
      AEGISFLOW_RETENTION_INTERVAL_SECONDS: ${AEGISFLOW_RETENTION_INTERVAL_SECONDS:-86400}
      AEGISFLOW_EXPLANATION_PROVIDER: ${AEGISFLOW_EXPLANATION_PROVIDER:-disabled}
      AEGISFLOW_EXPLANATION_BASE_URL: ${AEGISFLOW_EXPLANATION_BASE_URL:-https://api.openai.com/v1}
      AEGISFLOW_EXPLANATION_MODEL: ${AEGISFLOW_EXPLANATION_MODEL:-}
      AEGISFLOW_EXPLANATION_API_KEY: ${AEGISFLOW_EXPLANATION_API_KEY:-}
      AEGISFLOW_EXPLANATION_TIMEOUT_SECONDS: ${AEGISFLOW_EXPLANATION_TIMEOUT_SECONDS:-5}
      AEGISFLOW_EXPLANATION_RETRIES: ${AEGISFLOW_EXPLANATION_RETRIES:-1}
      AEGISFLOW_EXPLANATION_RATE_PER_MINUTE: ${AEGISFLOW_EXPLANATION_RATE_PER_MINUTE:-5}
      AEGISFLOW_EXPLANATION_CACHE_SIZE: ${AEGISFLOW_EXPLANATION_CACHE_SIZE:-256}
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    read_only: true
    tmpfs: ["/tmp"]
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]

  detector:
    build:
      context: .
      dockerfile: infra/docker/backend.Dockerfile
    command: ["python", "-m", "services.detector.main"]
    restart: unless-stopped
    environment:
      AEGISFLOW_REDIS_URL: redis://redis:6379/0
      AEGISFLOW_MODEL_REGISTRY: /app/models/registry
      AEGISFLOW_PENDING_IDLE_MS: ${AEGISFLOW_PENDING_IDLE_MS:-30000}
      AEGISFLOW_STREAM_MAXLEN: ${AEGISFLOW_STREAM_MAXLEN:-100000}
      AEGISFLOW_STREAM_MAX_PAYLOAD_BYTES: ${AEGISFLOW_STREAM_MAX_PAYLOAD_BYTES:-1048576}
      AEGISFLOW_DETECTOR_BATCH_SIZE: ${AEGISFLOW_DETECTOR_BATCH_SIZE:-64}
      AEGISFLOW_DETECTOR_BATCH_WAIT_MS: ${AEGISFLOW_DETECTOR_BATCH_WAIT_MS:-250}
    depends_on:
      redis: { condition: service_healthy }
    read_only: true
    tmpfs: ["/tmp"]
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]

  sensor:
    build:
      context: .
      dockerfile: infra/docker/backend.Dockerfile
    command: ["python", "-m", "services.sensor.main", "--mode", "demo"]
    environment:
      AEGISFLOW_REDIS_URL: redis://redis:6379/0
      AEGISFLOW_STREAM_MAXLEN: ${AEGISFLOW_STREAM_MAXLEN:-100000}
      AEGISFLOW_STREAM_MAX_PAYLOAD_BYTES: ${AEGISFLOW_STREAM_MAX_PAYLOAD_BYTES:-1048576}
    depends_on:
      redis: { condition: service_healthy }
    read_only: true
    tmpfs: ["/tmp"]
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    profiles: ["demo"]

  dashboard:
    build:
      context: ./apps/dashboard
      dockerfile: ../../infra/docker/dashboard.Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:5173:8080"
    depends_on:
      api: { condition: service_started }
    read_only: true
    tmpfs: ["/tmp", "/var/cache/nginx", "/var/run"]
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]

volumes:
  postgres-data:
  redis-data:
