apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: aegisflow
resources:
  - namespace.yaml
  - platform.yaml
  - network-policy.yaml
images:
  - name: aegisflow-backend
    newName: registry.example.invalid/security/aegisflow-backend
    newTag: replace-with-immutable-release
  - name: aegisflow-dashboard
    newName: registry.example.invalid/security/aegisflow-dashboard
    newTag: replace-with-immutable-release
