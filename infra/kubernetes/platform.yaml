apiVersion: v1
kind: ConfigMap
metadata:
  name: aegisflow-config
data:
  AEGISFLOW_DEMO: "0"
  AEGISFLOW_DEMO_SEED: "0"
  AEGISFLOW_AUTH_MODE: oidc
  AEGISFLOW_OIDC_ISSUER: https://identity.example.invalid/
  AEGISFLOW_OIDC_AUDIENCE: aegisflow-api
  AEGISFLOW_OIDC_JWKS_URL: https://identity.example.invalid/.well-known/jwks.json
  AEGISFLOW_OIDC_ALGORITHMS: RS256
  AEGISFLOW_OIDC_ROLES_CLAIM: roles
  AEGISFLOW_CORS_ORIGINS: https://aegisflow.example.invalid
  AEGISFLOW_CONSUME_REDIS: "1"
  AEGISFLOW_MODEL_REGISTRY: /var/lib/aegisflow/models
  AEGISFLOW_EVALUATION_REPORT_DIR: /var/lib/aegisflow/evaluations
  AEGISFLOW_MODEL_GOVERNANCE_ENABLED: "0"
  AEGISFLOW_MODEL_REQUIRED_EVALUATION_MODES: grouped,time,source_file,leave_family_out,cross_dataset
  AEGISFLOW_RETENTION_ENABLED: "0"
  AEGISFLOW_RETENTION_EXTERNAL: "1"
  AEGISFLOW_RETENTION_DAYS: "30"
  AEGISFLOW_AUDIT_RETENTION_DAYS: "365"
  AEGISFLOW_DETECTOR_BATCH_SIZE: "64"
  AEGISFLOW_PERSISTENCE_BATCH_SIZE: "64"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: model-registry
spec:
  accessModes: [ReadWriteMany]
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: evaluation-reports
spec:
  accessModes: [ReadWriteMany]
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
spec:
  replicas: 2
  selector:
    matchLabels: {app.kubernetes.io/name: aegisflow-api}
  template:
    metadata:
      labels: {app.kubernetes.io/name: aegisflow-api}
    spec:
      serviceAccountName: aegisflow
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      initContainers:
        - name: migrations
          image: aegisflow-backend
          command: [python, -m, scripts.migrate]
          envFrom:
            - configMapRef: {name: aegisflow-config}
            - secretRef: {name: aegisflow-runtime-secrets}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
      containers:
        - name: api
          image: aegisflow-backend
          command: [uvicorn, apps.api.main:app, --host, 0.0.0.0, --port, "8000"]
          ports: [{name: http, containerPort: 8000}]
          envFrom:
            - configMapRef: {name: aegisflow-config}
            - secretRef: {name: aegisflow-runtime-secrets}
          readinessProbe:
            httpGet: {path: /health/ready, port: http}
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /health/live, port: http}
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests: {cpu: 500m, memory: 768Mi}
            limits: {cpu: "2", memory: 2Gi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
            - {name: models, mountPath: /var/lib/aegisflow/models}
            - {name: evaluations, mountPath: /var/lib/aegisflow/evaluations, readOnly: true}
      volumes:
        - {name: tmp, emptyDir: {sizeLimit: 128Mi}}
        - {name: models, persistentVolumeClaim: {claimName: model-registry}}
        - {name: evaluations, persistentVolumeClaim: {claimName: evaluation-reports}}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: detector
spec:
  replicas: 2
  selector:
    matchLabels: {app.kubernetes.io/name: aegisflow-detector}
  template:
    metadata:
      labels: {app.kubernetes.io/name: aegisflow-detector}
    spec:
      serviceAccountName: aegisflow
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: detector
          image: aegisflow-backend
          command: [python, -m, services.detector.main]
          envFrom:
            - configMapRef: {name: aegisflow-config}
            - secretRef: {name: aegisflow-runtime-secrets}
          resources:
            requests: {cpu: 500m, memory: 768Mi}
            limits: {cpu: "2", memory: 2Gi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
            - {name: models, mountPath: /var/lib/aegisflow/models, readOnly: true}
      volumes:
        - {name: tmp, emptyDir: {sizeLimit: 128Mi}}
        - {name: models, persistentVolumeClaim: {claimName: model-registry}}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dashboard
spec:
  replicas: 2
  selector:
    matchLabels: {app.kubernetes.io/name: aegisflow-dashboard}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: aegisflow-dashboard
        network.aegisflow.io/api-client: "true"
    spec:
      serviceAccountName: aegisflow
      securityContext:
        runAsNonRoot: true
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: dashboard
          image: aegisflow-dashboard
          ports: [{name: http, containerPort: 8080}]
          readinessProbe:
            httpGet: {path: /, port: http}
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 500m, memory: 256Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
            - {name: cache, mountPath: /var/cache/nginx}
            - {name: run, mountPath: /var/run}
      volumes:
        - {name: tmp, emptyDir: {sizeLimit: 64Mi}}
        - {name: cache, emptyDir: {sizeLimit: 64Mi}}
        - {name: run, emptyDir: {sizeLimit: 16Mi}}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: aegisflow
automountServiceAccountToken: false
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: retention
spec:
  schedule: "17 2 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels: {app.kubernetes.io/name: aegisflow-retention}
        spec:
          restartPolicy: Never
          serviceAccountName: aegisflow
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            seccompProfile: {type: RuntimeDefault}
          containers:
            - name: retention
              image: aegisflow-backend
              command: [python, -m, scripts.retention_cleanup]
              envFrom:
                - configMapRef: {name: aegisflow-config}
                - secretRef: {name: aegisflow-runtime-secrets}
              env:
                - {name: AEGISFLOW_RETENTION_ENABLED, value: "1"}
                - {name: AEGISFLOW_RETENTION_EXTERNAL, value: "0"}
              resources:
                requests: {cpu: 100m, memory: 256Mi}
                limits: {cpu: "1", memory: 1Gi}
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities: {drop: [ALL]}
              volumeMounts:
                - {name: tmp, mountPath: /tmp}
          volumes:
            - {name: tmp, emptyDir: {sizeLimit: 128Mi}}
---
apiVersion: v1
kind: Service
metadata:
  name: api
spec:
  selector: {app.kubernetes.io/name: aegisflow-api}
  ports: [{name: http, port: 8000, targetPort: http}]
---
apiVersion: v1
kind: Service
metadata:
  name: dashboard
spec:
  selector: {app.kubernetes.io/name: aegisflow-dashboard}
  ports: [{name: http, port: 8080, targetPort: http}]
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: api
spec:
  minAvailable: 1
  selector:
    matchLabels: {app.kubernetes.io/name: aegisflow-api}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: detector
spec:
  minAvailable: 1
  selector:
    matchLabels: {app.kubernetes.io/name: aegisflow-detector}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: aegisflow
spec:
  tls:
    - hosts: [aegisflow.example.invalid]
      secretName: aegisflow-tls
  rules:
    - host: aegisflow.example.invalid
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service: {name: api, port: {name: http}}
          - path: /health
            pathType: Prefix
            backend:
              service: {name: api, port: {name: http}}
          - path: /
            pathType: Prefix
            backend:
              service: {name: dashboard, port: {name: http}}
